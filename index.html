<!-- ========================================== -->
<!-- PANEL DE ACCESIBILIDAD (HTML)              -->
<!-- ========================================== -->
<div class="panel-accesibilidad" id="panelAccesibilidad" role="dialog" aria-label="Panel de accesibilidad">
    <h3>♿ Opciones de accesibilidad</h3>
    
    <div class="opcion">
        <span>🔍 Tamaño de texto</span>
        <div>
            <button id="disminuirTexto" aria-label="Disminuir tamaño de texto">A-</button>
            <button id="aumentarTexto" aria-label="Aumentar tamaño de texto">A+</button>
        </div>
    </div>
    
    <div class="opcion">
        <span>🌓 Contraste</span>
        <button id="toggleContraste" aria-label="Activar o desactivar alto contraste">Activar</button>
    </div>
    
    <div class="opcion">
        <span>📖 Lectura fácil</span>
        <button id="toggleLectura" aria-label="Activar o desactivar modo lectura">Activar</button>
    </div>
</div>

<script>
    // =============================================
    // 1. ABRIR/CERRAR PANEL DE ACCESIBILIDAD
    // =============================================
    const btnAccesibilidad = document.getElementById('btnAccesibilidad');
    const panelAccesibilidad = document.getElementById('panelAccesibilidad');
    let panelAbierto = false;

    btnAccesibilidad.addEventListener('click', function(e) {
        e.stopPropagation();
        panelAbierto = !panelAbierto;
        panelAccesibilidad.classList.toggle('activo', panelAbierto);
        this.setAttribute('aria-expanded', panelAbierto);
    });

    // Cerrar panel al hacer clic fuera
    document.addEventListener('click', function(e) {
        if (panelAbierto && !panelAccesibilidad.contains(e.target) && e.target !== btnAccesibilidad) {
            panelAccesibilidad.classList.remove('activo');
            panelAbierto = false;
            btnAccesibilidad.setAttribute('aria-expanded', 'false');
        }
    });

    // Cerrar con ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && panelAbierto) {
            panelAccesibilidad.classList.remove('activo');
            panelAbierto = false;
            btnAccesibilidad.setAttribute('aria-expanded', 'false');
            btnAccesibilidad.focus();
        }
    });

    // =============================================
    // 2. FUNCIONES DE ACCESIBILIDAD
    // =============================================

    // Aumentar texto
    let tamañoTexto = 100;
    const body = document.body;

    document.getElementById('aumentarTexto').addEventListener('click', function() {
        if (tamañoTexto < 140) {
            tamañoTexto += 10;
            body.style.fontSize = tamañoTexto + '%';
        }
    });

    document.getElementById('disminuirTexto').addEventListener('click', function() {
        if (tamañoTexto > 70) {
            tamañoTexto -= 10;
            body.style.fontSize = tamañoTexto + '%';
        }
    });

    // Alto contraste
    let contrasteActivo = false;
    document.getElementById('toggleContraste').addEventListener('click', function() {
        contrasteActivo = !contrasteActivo;
        body.classList.toggle('alto-contraste', contrasteActivo);
        this.textContent = contrasteActivo ? 'Desactivar' : 'Activar';
        this.classList.toggle('activo', contrasteActivo);
    });

    // Modo lectura fácil
    let lecturaActiva = false;
    document.getElementById('toggleLectura').addEventListener('click', function() {
        lecturaActiva = !lecturaActiva;
        body.classList.toggle('lectura-facil', lecturaActiva);
        this.textContent = lecturaActiva ? 'Desactivar' : 'Activar';
        this.classList.toggle('activo', lecturaActiva);
    });

    // =============================================
    // 3. ESTILOS PARA LOS MODOS (se añaden al CSS)
    // =============================================
    // (Estos estilos se añaden dinámicamente)
    const styleAccesibilidad = document.createElement('style');
    styleAccesibilidad.textContent = `
        /* Alto contraste */
        body.alto-contraste {
            background: #000 !important;
            color: #fff !important;
        }
        body.alto-contraste .card {
            background: #1a1a1a !important;
            border-color: #fff !important;
        }
        body.alto-contraste .card p {
            color: #ddd !important;
        }
        body.alto-contraste .card h2 {
            color: #fff !important;
        }
        body.alto-contraste header {
            background: #000 !important;
            border-color: #fff !important;
        }
        body.alto-contraste nav a {
            color: #fff !important;
        }
        body.alto-contraste .btn-card {
            border: 2px solid #fff !important;
        }
        body.alto-contraste .panel-accesibilidad {
            background: #1a1a1a !important;
            border-color: #fff !important;
        }
        body.alto-contraste .panel-accesibilidad h3,
        body.alto-contraste .panel-accesibilidad .opcion span {
            color: #fff !important;
        }
        body.alto-contraste footer {
            background: #000 !important;
        }

        /* Modo lectura fácil */
        body.lectura-facil .card p {
            font-size: 1.2rem !important;
            line-height: 1.8 !important;
        }
        body.lectura-facil .hero p {
            font-size: 1.4rem !important;
            line-height: 1.8 !important;
        }
        body.lectura-facil .card .btn-card {
            font-size: 1.1rem !important;
            padding: 14px 32px !important;
        }
        body.lectura-facil nav a {
            font-size: 1.1rem !important;
        }
    `;
    document.head.appendChild(styleAccesibilidad);
</script>
